<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cours interactif — BTS SIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f2ea; --paper:#fffdf8; --ink:#1e1c17; --muted:#6b665b; --line:#e3ddcf;
  --acc:#2846c4; --acc-soft:#e6eaff; --ok:#1f8a4c; --ok-soft:#e2f4e9; --ko:#c2402b; --ko-soft:#fbe7e2;
  --hl:#ffe9a8;
  --g1:#2846c4; --g2:#d2562b; --g3:#1f8a4c; --g4:#9b3fb5; --g5:#c9961a;
}
body.stats{ --acc:#c2562b; --acc-soft:#fbe9df; }
body.grand{ --acc:#1f7a52; --acc-soft:#e0f2e8; }
body.cult{ --acc:#7a3fb5; --acc-soft:#efe5f8; }
body.cejm{ --acc:#0d7280; --acc-soft:#dff1f3; }
body.cyber{ --acc:#a32638; --acc-soft:#f8e1e4; }
.tab.cult[aria-selected="true"]{background:#7a3fb5;border-color:#7a3fb5}
.tab.cejm[aria-selected="true"]{background:#0d7280;border-color:#0d7280}
.tab.cyber[aria-selected="true"]{background:#a32638;border-color:#a32638}
.fc{min-height:140px;border:2px solid var(--acc);border-radius:16px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:19px;padding:20px 24px;cursor:pointer;background:#fff;user-select:none}
.fc.back{background:var(--acc-soft);font-size:17px}
.fcend{font-size:18px}
.srow{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px;background:#fff;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.srow .stxt{flex:1 1 260px}
.srow .scats{display:flex;flex-wrap:wrap;gap:4px}
.srow.okc{background:var(--ok-soft);border-color:var(--ok)} .srow.koc{background:var(--ko-soft);border-color:var(--ko)}
.sfix{flex-basis:100%;font-size:14px;color:var(--ko);font-weight:600}
ol.ord{padding-left:22px;margin:0 0 10px}
ol.ord li{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px;background:#fff;display:flex;justify-content:space-between;gap:10px;align-items:center}
ol.ord li.okc{background:var(--ok-soft);border-color:var(--ok)} ol.ord li.koc{background:var(--ko-soft);border-color:var(--ko)}
.ordb{display:flex;gap:4px;flex-shrink:0}
.bl{padding:8px 0;border-bottom:1px dashed var(--line);line-height:2}
.bl select{font-size:14px;padding:3px 6px}
select.selok{border-color:var(--ok);background:var(--ok-soft)} select.selko{border-color:var(--ko);background:var(--ko-soft)}
blockquote.doc{margin:8px 0 14px;padding:12px 16px;border-left:4px solid var(--acc);background:#fff;border-radius:0 10px 10px 0;font-style:italic}
blockquote.doc b{font-style:normal}
table.rm td{min-width:90px;height:44px;font-size:13px}
.tg{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.tgl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;min-width:190px}
.tg .tabs{margin-top:0}
.tab.info[aria-selected="true"]{background:#2846c4;border-color:#2846c4}
.tab.appro[aria-selected="true"]{background:#c2562b;border-color:#c2562b}
.tab.grand{border-color:#1f7a52;color:#1f7a52}
.tab.grand[aria-selected="true"]{background:#1f7a52;color:#fff}
.chk{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer}
pre{font-size:14px}
table.mat td{min-width:38px}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.55 "Source Sans 3",system-ui,sans-serif;}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700;line-height:1.2;margin:0 0 .5em}
.ov{display:inline-block;border-top:1.5px solid currentColor;line-height:1.05;padding-top:1px;margin:0 .08em}
.ov2{display:inline-block;border-top:1.5px solid currentColor;padding-top:11px;line-height:1;margin:0 1px}
.mono,code{font-family:"JetBrains Mono",monospace;font-size:.92em}
header{padding:28px 20px 0;max-width:980px;margin:0 auto}
.kicker{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
header h1{font-size:clamp(26px,4vw,38px);margin-top:6px}
.tabs{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.tab{border:1.5px solid var(--line);background:var(--paper);padding:10px 18px;border-radius:999px;font:600 15px "Source Sans 3";cursor:pointer;color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
main{max-width:980px;margin:0 auto;padding:18px 20px 60px}
.stepper{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.dot{flex:1 1 0;min-width:28px;height:30px;border-radius:8px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;font:600 13px "JetBrains Mono";color:var(--muted)}
.dot.seen{background:var(--acc-soft);border-color:transparent;color:var(--acc)}
.dot.cur{background:var(--acc);color:#fff;border-color:var(--acc)}
.dot.quiz{flex:1.6 1 0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:26px clamp(18px,3vw,34px);box-shadow:0 1px 0 rgba(0,0,0,.03)}
.steptag{color:var(--acc);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.card h2{font-size:clamp(22px,3vw,30px);margin-top:4px}
.def{border-left:4px solid var(--acc);background:var(--acc-soft);padding:12px 16px;border-radius:0 12px 12px 0;margin:14px 0}
.def b:first-child{display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin-bottom:2px}
.lab{border:1.5px dashed var(--line);border-radius:14px;padding:16px;margin:18px 0;background:#fcfaf4}
.lab>.labt{font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.btn{border:1.5px solid var(--line);background:var(--paper);padding:9px 16px;border-radius:10px;font:600 15px "Source Sans 3";cursor:pointer;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.sm{padding:5px 11px;font-size:14px}
.btn:disabled{opacity:.4;cursor:default}
.nav{display:flex;justify-content:space-between;margin-top:18px;gap:10px}
.sw{display:inline-flex;align-items:center;gap:8px;font-family:"JetBrains Mono";font-weight:600}
.sw button{width:52px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font:700 18px "JetBrains Mono";cursor:pointer}
.sw button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
table.tt{border-collapse:collapse;font-family:"JetBrains Mono";font-size:15px;margin:6px 0}
table.tt th,table.tt td{border:1px solid var(--line);padding:5px 12px;text-align:center}
table.tt th{background:#f3efe4;font-weight:600}
table.tt tr.cur td{background:var(--hl)}
table.tt td.res{font-weight:700}
.tbls{display:flex;gap:22px;flex-wrap:wrap}
.big{font-family:"JetBrains Mono";font-size:20px;font-weight:600}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--acc-soft);color:var(--acc);font-weight:700;font-family:"JetBrains Mono"}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin:12px 0}
.prop{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
.prop b{display:block;font-size:14px;color:var(--muted)}
.prop .mono{font-size:16px}
select,input[type=number],input[type=text],textarea{font:15px "JetBrains Mono";padding:7px 9px;border:1.5px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
textarea{width:100%;min-height:54px;resize:vertical}
/* quiz */
.quizbox{margin-top:20px;border-top:1px solid var(--line);padding-top:18px}
.qtag{font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin-bottom:6px}
.qhead{display:flex;justify-content:space-between;font-weight:600;color:var(--muted);font-size:14px}
.qbar{height:6px;background:var(--line);border-radius:6px;margin:8px 0 14px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.qq{font-size:19px;font-weight:600;margin-bottom:12px}
.qopts{display:grid;gap:8px}
.qopt{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:11px 14px;font:16px "Source Sans 3";cursor:pointer;color:var(--ink)}
.qopt:hover:not(:disabled){border-color:var(--acc)}
.qopt.good{background:var(--ok-soft);border-color:var(--ok)}
.qopt.bad{background:var(--ko-soft);border-color:var(--ko)}
.qopt:disabled{cursor:default}
.qfb{margin-top:12px;padding:12px 14px;line-height:2.1;border-radius:11px;background:#f3efe4}
.qfb.ok{background:var(--ok-soft)} .qfb.ko{background:var(--ko-soft)}
.qnav{margin-top:12px;display:flex;gap:8px}
.score{font-family:Fraunces;font-size:54px;font-weight:700;color:var(--acc)}
.review{margin-top:12px;font-size:15px}
.review li{margin-bottom:8px}
/* karnaugh */
table.km{border-collapse:separate;border-spacing:6px;font-family:"JetBrains Mono"}
table.km th{font-weight:600;padding:2px 6px;color:var(--muted)}
table.km td.c{width:84px;height:74px;border:2px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;position:relative;text-align:center;font-size:13px;color:var(--muted);user-select:none}
table.km td.c.on{background:var(--acc-soft);color:var(--ink);border-color:var(--acc)}
table.km td.c .v{display:block;margin-top:-8px;font-size:20px;font-weight:700;color:var(--ink)}
.marks{position:absolute;left:6px;right:6px;bottom:5px;display:flex;gap:3px}
.marks i{flex:1;height:5px;border-radius:3px}
.terms{font-family:"JetBrains Mono";font-size:20px;font-weight:600}
.terms span.t{padding:1px 6px;border-radius:6px}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}
.chip{min-width:38px;padding:4px 6px;border-radius:8px;background:#fff;border:1px solid var(--line);text-align:center;font-family:"JetBrains Mono";font-size:14px;line-height:1.1}
.chip small{display:block;font-size:10px;color:var(--muted)}
.chip.me{background:var(--acc);color:#fff;border-color:var(--acc)} .chip.me small{color:#fff}
.chip.q{background:var(--hl);border-color:#e0c060}
.chip.mid{background:var(--acc-soft)}
.out{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.out div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 12px}
.out div b{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.out div span{font-family:"JetBrains Mono";font-weight:600;font-size:18px}
svg{max-width:100%;height:auto;display:block}
svg text{font-family:"Source Sans 3";font-size:13px;fill:var(--muted)}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.compare{grid-template-columns:1fr}.dot{min-width:22px}}
.compare>div{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;font-size:15px}
.compare h3{font-size:18px}
.reveal-step{display:none;font-family:"JetBrains Mono";padding:4px 0}
.reveal-step.show{display:block}
.reveal-step em{font-family:"Source Sans 3";color:var(--muted);font-style:normal;font-size:14px;margin-left:10px}
td.edit{cursor:pointer;min-width:42px}
td.edit.okc{background:var(--ok-soft)} td.edit.koc{background:var(--ko-soft)}
input[type=range]{width:min(360px,100%);accent-color:var(--acc)}
.muted{color:var(--muted);font-size:15px}
</style>
</head>
<body>
<header>
  <div class="kicker">BTS SIO option SISR · Révisions interactives de toutes les épreuves</div>
  <h1 id="htitle">Calcul booléen</h1>
  <div id="tabs"></div>
</header>
<main>
  <div class="stepper" id="stepper"></div>
  <section class="card" id="card"></section>
  <div class="nav"><button class="btn" id="prev">← Précédent</button><button class="btn primary" id="next">Suivant →</button></div>
</main>

<script>
const ov = x => `<span class="ov">${x}</span>`;
const ovo = x => `<span class="ov2">${x}</span>`;
const fmt = (x,d=2) => Number.isFinite(x) ? x.toLocaleString('fr-FR',{maximumFractionDigits:d}) : '—';
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const store = { get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}} };

/* ---------- Quiz engine ---------- */
function makeQuiz(root, qs, single=false, opts={}){
  let order, i, score, missed, results;
  function start(){ order = single ? [0] : shuffle(qs.map((_,k)=>k)); i=0; score=0; missed=[]; results=[]; render(); }
  function render(){
    if(i>=order.length) return end();
    const q = qs[order[i]], perm = shuffle(q.opts.map((_,k)=>k));
    root.innerHTML = (single ? `<div class="qtag">✔ Vérifie ta compréhension</div>`
      : `<div class="qhead"><span>Question ${i+1} / ${order.length}</span><span>Score : ${score}</span></div><div class="qbar"><i style="width:${i/order.length*100}%"></i></div>`)
      + `${q.ch&&!single?`<div class="muted" style="margin-bottom:4px">${q.exam?'📝 Type examen · ':''}${CH[q.ch].name}</div>`:''}<div class="qq">${q.q}</div><div class="qopts">${perm.map(k=>`<button class="qopt" data-k="${k}">${q.opts[k]}</button>`).join('')}</div><div class="qfb" hidden></div><div class="qnav" hidden></div>`;
    root.querySelectorAll('.qopt').forEach(b => b.onclick = () => {
      const k = +b.dataset.k, ok = k === q.a;
      if(ok) score++; else missed.push(q); results.push({q,ok});
      root.querySelectorAll('.qopt').forEach(x => { x.disabled = true; const kk=+x.dataset.k; if(kk===q.a) x.classList.add('good'); else if(kk===k) x.classList.add('bad'); });
      const fb = root.querySelector('.qfb'); fb.hidden=false; fb.className='qfb '+(ok?'ok':'ko');
      fb.innerHTML = `<b>${ok ? ['Exact !','Bien vu !','Parfait.','Bravo !'][Math.floor(Math.random()*4)] : 'Pas tout à fait.'}</b> ${q.ex}`;
      const nav = root.querySelector('.qnav'); nav.hidden=false;
      if(single){ nav.innerHTML = `<button class="btn sm">↻ Réessayer</button>`; nav.firstChild.onclick = start; }
      else { nav.innerHTML = `<button class="btn primary">${i===order.length-1?'Voir mon score':'Question suivante →'}</button>`; nav.firstChild.onclick = () => { i++; render(); }; }
    });
  }
  function end(){
    const p = Math.round(score/order.length*100);
    const msg = p===100?'Sans faute, chapitre maîtrisé !':p>=75?'Très bien : relis juste les points ci-dessous.':p>=50?'C\'est en bonne voie. Revois les étapes concernées.':'Reprends le cours pas à pas, puis retente le quiz.';
    root.innerHTML = `<div class="qtag">Résultat</div><div class="score">${score} / ${order.length}</div><p><b>${msg}</b></p>`
      + (missed.length ? `<div class="review"><b>À revoir :</b><ul>${missed.map(q=>`<li>${q.q}<br><span class="muted">Réponse : ${q.opts[q.a]} — ${q.ex}</span></li>`).join('')}</ul></div>` : '')
      + `<div class="qnav"><button class="btn primary restart">↻ ${opts.onRestart?'Nouveau tirage':'Recommencer le quiz'}</button></div>`;
    if(results.some(r=>r.q.ch)){ const by={}; results.forEach(r=>{ const c=r.q.ch; by[c]=by[c]||[0,0]; by[c][1]++; if(r.ok) by[c][0]++; });
      const rows=Object.entries(by).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1]);
      root.querySelector('.qnav').insertAdjacentHTML('beforebegin',`<div class="review"><b>Bilan par chapitre</b> (du plus fragile au plus solide) :<table class="tt" style="width:100%">${rows.map(([c,[g,t]])=>`<tr><td style="text-align:left">${CH[c].name}</td><td style="width:45%"><div style="height:10px;background:var(--line);border-radius:5px;overflow:hidden"><div style="height:100%;width:${g/t*100}%;background:${g/t>=.75?'var(--ok)':g/t>=.5?'var(--g5)':'var(--ko)'}"></div></div></td><td>${g}/${t}</td><td>${g/t<.75?`<button class="btn sm goch" data-ch="${c}">Revoir</button>`:'✅'}</td></tr>`).join('')}</table></div>`);
      root.querySelectorAll('.goch').forEach(b=>b.onclick=()=>{ setCh(b.dataset.ch); scrollTo({top:0}); }); }
    root.querySelector('.restart').onclick = opts.onRestart || start;
    if(!opts.onRestart){ const k='best-'+state.ch; if(score > store.get(k,-1)) store.set(k,score); }
  }
  start();
}

/* ---------- Boolean helpers ---------- */
function switches(root, names, vals, onchange){
  root.innerHTML = names.map(n=>`<span class="sw">${n} = <button data-n="${n}"></button></span>`).join('');
  const paint = () => root.querySelectorAll('button').forEach(b=>{const v=vals[b.dataset.n]; b.textContent=v; b.classList.toggle('on',!!v);});
  root.querySelectorAll('button').forEach(b=>b.onclick=()=>{vals[b.dataset.n]^=1; paint(); onchange();});
  paint(); onchange();
}
const VARS3 = ['a','b','c'];
function minimize(ones, n){
  const N = 1<<n;
  if(ones.size===0) return {terms:[], text:'0'};
  if(ones.size===N) return {terms:[[2,2,2].slice(0,n)], text:'1'};
  const cubes=[]; const tot=3**n;
  for(let t=0;t<tot;t++){ const p=[]; let x=t; for(let v=0;v<n;v++){p.push(x%3); x=Math.floor(x/3);} cubes.push(p); }
  const cover = p => { const r=[]; for(let m=0;m<N;m++){ let ok=true; for(let v=0;v<n;v++){ const bit=(m>>(n-1-v))&1; if(p[v]!==2 && p[v]!==bit){ok=false;break;} } if(ok) r.push(m);} return r; };
  const imps = cubes.map(p=>({p,c:cover(p)})).filter(o=>o.c.every(m=>ones.has(m)));
  const primes = imps.filter(o=>!imps.some(o2=>o2!==o && o2.c.length>o.c.length && o.c.every(m=>o2.c.includes(m))));
  let best=null;
  for(let mask=1; mask<(1<<primes.length); mask++){
    const sel = primes.filter((_,k)=>mask>>k&1);
    const cov = new Set(sel.flatMap(o=>o.c));
    if([...ones].every(m=>cov.has(m))){
      const lits = sel.reduce((s,o)=>s+o.p.filter(x=>x!==2).length,0);
      if(!best || sel.length<best.sel.length || (sel.length===best.sel.length && lits<best.lits)) best={sel,lits};
    }
  }
  const terms = best.sel.map(o=>o.p);
  return {terms, covers: best.sel.map(o=>o.c), text: terms.map(p=>termStr(p)).join(' + ')};
}
function termStr(p){ const s = p.map((x,v)=> x===2?'':(x?VARS3[v]:ov(VARS3[v]))).join(''); return s||'1'; }
const GCOL = ['var(--g1)','var(--g2)','var(--g3)','var(--g4)','var(--g5)'];

function karnaugh(root, n, presets){
  const ones = new Set();
  const rows = [1,0];
  const cols = n===2 ? [[1],[0]] : [[1,1],[1,0],[0,0],[0,1]];
  const colLbl = n===2 ? ['b',ov('b')] : ['bc','b'+ov('c'),ov('b')+ov('c'),ov('b')+'c'];
  const mint = (a,col) => n===2 ? a*2+col[0] : a*4+col[0]*2+col[1];
  const cellLbl = (a,col) => (a?'a':ov('a')) + (n===2 ? (col[0]?'b':ov('b')) : (col[0]?'b':ov('b'))+(col[1]?'c':ov('c')));
  root.innerHTML = `<div class="row" style="align-items:flex-start;gap:26px">
     <table class="km"><tr><th></th>${colLbl.map(l=>`<th>${l}</th>`).join('')}</tr>
     ${rows.map(a=>`<tr><th>${a?'a':ov('a')}</th>${cols.map(c=>`<td class="c" data-m="${mint(a,c)}"><span class="v">0</span>${cellLbl(a,c)}<div class="marks"></div></td>`).join('')}</tr>`).join('')}</table>
     <div style="flex:1;min-width:220px"><div class="muted">Expression des cases cochées :</div><div class="mono kexp" style="margin:4px 0 12px;font-size:15px"></div>
     <div class="muted">Forme simplifiée :</div><div class="terms kres"></div><div class="muted kexpl" style="margin-top:8px"></div></div></div>
     <div class="row" style="margin-top:10px">${presets.map((p,k)=>`<button class="btn sm" data-p="${k}">${p.label}</button>`).join('')}<button class="btn sm" data-p="clr">Tout effacer</button></div>`;
  const paint = () => {
    const r = minimize(ones, n);
    root.querySelectorAll('td.c').forEach(td=>{ const m=+td.dataset.m, on=ones.has(m); td.classList.toggle('on',on); td.querySelector('.v').textContent=on?1:0;
      td.querySelector('.marks').innerHTML = (r.covers||[]).map((c,k)=>c.includes(m)?`<i style="background:${GCOL[k%5]}"></i>`:'').join(''); });
    const allTerms = [...ones].sort((x,y)=>y-x).map(m=>{ const p=[]; for(let v=0;v<n;v++) p.push((m>>(n-1-v))&1); return termStr(p);});
    root.querySelector('.kexp').innerHTML = allTerms.length? allTerms.join(' + ') : '—';
    root.querySelector('.kres').innerHTML = r.text==='0'||r.text==='1' ? r.text : r.terms.map((p,k)=>`<span class="t" style="background:color-mix(in srgb, ${GCOL[k%5]} 16%, transparent);color:${GCOL[k%5]}">${termStr(p)}</span>`).join(' + ');
    root.querySelector('.kexpl').innerHTML = r.terms.length && r.text!=='1' && r.text!=='0' ? r.terms.map((p,k)=>{const sz=2**p.filter(x=>x===2).length, lit=p.filter(x=>x!==2).length; return `<span style="color:${GCOL[k%5]}">■</span> bloc de ${sz} case${sz>1?'s':''} → ${lit} variable${lit>1?'s':''}`;}).join('<br>') : '';
  };
  root.querySelectorAll('td.c').forEach(td=>td.onclick=()=>{const m=+td.dataset.m; ones.has(m)?ones.delete(m):ones.add(m); paint();});
  root.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ ones.clear(); if(b.dataset.p!=='clr') presets[+b.dataset.p].m.forEach(m=>ones.add(m)); paint(); });
  if(presets[0]) presets[0].m.forEach(m=>ones.add(m));
  paint();
}

/* ---------- Stats helpers ---------- */
const parseSeries = s => s.replace(/;/g,' ').split(/\s+/).map(x=>parseFloat(x.replace(',','.'))).filter(Number.isFinite);
function medianInfo(sorted){ const N=sorted.length; if(!N) return null;
  if(N%2) { const r=(N+1)/2; return {val:sorted[r-1], ranks:[r], txt:`N = ${N} est <b>impair</b> → la médiane est la valeur de rang (N+1)/2 = <b>${r}</b>.`}; }
  const r=N/2; return {val:(sorted[r-1]+sorted[r])/2, ranks:[r,r+1], txt:`N = ${N} est <b>pair</b> → la médiane est la moyenne des valeurs de rangs N/2 = <b>${r}</b> et N/2+1 = <b>${r+1}</b> : (${fmt(sorted[r-1])} + ${fmt(sorted[r])}) / 2.`}; }
const qRank = (p,N) => Math.max(1, Math.ceil(p*N - 1e-9));
function expand(vals, counts){ const r=[]; vals.forEach((v,k)=>{for(let j=0;j<counts[k];j++) r.push(v);}); return r; }
const JAN = expand([0,1,3,4,5,8],[3,6,7,9,4,2]), FEV = expand([1,2,5,6,9],[1,5,8,10,4]);
function fiveNum(s){ s=s.slice().sort((a,b)=>a-b); const N=s.length; return {min:s[0], q1:s[qRank(.25,N)-1], me:medianInfo(s).val, q3:s[qRank(.75,N)-1], max:s[N-1]}; }

function seriesWidget(root, mode){
  const init = '12 5 18 7 9 14 3 11';
  root.innerHTML = `<div class="row" style="margin-bottom:8px"><button class="btn sm" data-s="mine">Série courte</button><button class="btn sm" data-s="jan">Températures de janvier (31 j)</button><button class="btn sm" data-s="fev">Températures de février (28 j)</button></div>
    <textarea spellcheck="false">${init}</textarea><div class="muted">Tape ou modifie les valeurs (séparées par des espaces). La série est rangée automatiquement.</div>
    <div class="chips"></div><div class="expl"></div><div class="out"></div>`;
  const ta = root.querySelector('textarea');
  const paint = () => {
    const s = parseSeries(ta.value).sort((a,b)=>a-b), N=s.length;
    if(!N){ root.querySelector('.chips').innerHTML=''; root.querySelector('.expl').innerHTML='<i>Entre au moins une valeur.</i>'; root.querySelector('.out').innerHTML=''; return; }
    const me = medianInfo(s); const r1=qRank(.25,N), r3=qRank(.75,N);
    root.querySelector('.chips').innerHTML = s.map((v,k)=>{ const r=k+1; let cls='';
      if(mode==='me'){ if(me.ranks.includes(r)) cls='me'; }
      else { if(r===r1||r===r3) cls='q'; else if(r>r1&&r<r3) cls='mid'; if(me.ranks.includes(r)&&cls!=='q') cls+=' me'; }
      return `<div class="chip ${cls}"><small>${r}</small>${fmt(v)}</div>`; }).join('');
    let ex = `<p>${me.txt}</p>`;
    let out = `<div><b>Effectif N</b><span>${N}</span></div><div><b>Médiane Me</b><span>${fmt(me.val)}</span></div>`;
    if(mode==='q'){
      ex += `<p>Q1 : ${fmt(.25*N)} = 25/100 × ${N} → arrondi à l'entier supérieur : rang <b>${r1}</b>. &nbsp; Q3 : ${fmt(.75*N)} = 75/100 × ${N} → rang <b>${r3}</b>.</p>`;
      out += `<div><b>Q1</b><span>${fmt(s[r1-1])}</span></div><div><b>Q3</b><span>${fmt(s[r3-1])}</span></div><div><b>Écart interquartile</b><span>${fmt(s[r3-1]-s[r1-1])}</span></div>`;
    }
    root.querySelector('.expl').innerHTML = ex; root.querySelector('.out').innerHTML = out;
  };
  ta.oninput = paint;
  root.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ ta.value = b.dataset.s==='jan'?JAN.join(' '):b.dataset.s==='fev'?FEV.join(' '):init; paint(); });
  paint();
}

function freqTable(root, mode){
  let rows = [[1800,150],[2900,12],[4600,3]];
  const draw = () => {
    root.innerHTML = `<table class="tt"><tr><th>Valeur xᵢ</th><th>Effectif nᵢ</th>${mode==='v'?'<th>(xᵢ − x̄)²</th><th>nᵢ(xᵢ − x̄)²</th>':'<th>nᵢ × xᵢ</th>'}<th></th></tr>
      ${rows.map((r,k)=>`<tr><td><input type="number" data-k="${k}" data-j="0" value="${r[0]}" style="width:100px"></td><td><input type="number" min="0" data-k="${k}" data-j="1" value="${r[1]}" style="width:80px"></td><td class="c1"></td>${mode==='v'?'<td class="c2"></td>':''}<td><button class="btn sm" data-del="${k}">✕</button></td></tr>`).join('')}
      </table><div class="row"><button class="btn sm add">+ Ajouter une ligne</button><button class="btn sm rst">Exemple de l'entreprise</button></div><div class="expl" style="margin-top:10px"></div><div class="out"></div>`;
    root.querySelectorAll('input').forEach(inp=>inp.oninput=()=>{ rows[+inp.dataset.k][+inp.dataset.j] = parseFloat(inp.value)||0; calc(); });
    root.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ if(rows.length>1){rows.splice(+b.dataset.del,1); draw();} });
    root.querySelector('.add').onclick=()=>{rows.push([0,1]); draw();};
    root.querySelector('.rst').onclick=()=>{rows=[[1800,150],[2900,12],[4600,3]]; draw();};
    calc();
  };
  const calc = () => {
    const N = rows.reduce((s,r)=>s+r[1],0); const S = rows.reduce((s,r)=>s+r[0]*r[1],0); const m = N? S/N : NaN;
    const V = N ? rows.reduce((s,r)=>s+r[1]*(r[0]-m)**2,0)/N : NaN;
    const trs = root.querySelectorAll('table.tt tr');
    rows.forEach((r,k)=>{ const tr=trs[k+1]; if(mode==='v'){ tr.querySelector('.c1').textContent=fmt((r[0]-m)**2,0); tr.querySelector('.c2').textContent=fmt(r[1]*(r[0]-m)**2,0);} else tr.querySelector('.c1').textContent=fmt(r[0]*r[1]); });
    const ex = root.querySelector('.expl');
    if(mode==='m') ex.innerHTML = `<div class="mono">x̄ = (${rows.map(r=>`${r[1]}×${fmt(r[0])}`).join(' + ')}) / ${N}<br>&nbsp;&nbsp;= ${fmt(S)} / ${N} ≈ <b>${fmt(m)}</b></div>`;
    else ex.innerHTML = `<div class="mono">V = (${rows.map(r=>`${r[1]}(${fmt(r[0])} − ${fmt(m,1)})²`).join(' + ')}) / ${N} ≈ <b>${fmt(V,0)}</b><br>σ = √V ≈ <b>${fmt(Math.sqrt(V))}</b></div>`;
    root.querySelector('.out').innerHTML = `<div><b>N</b><span>${N}</span></div><div><b>Moyenne x̄</b><span>${fmt(m)}</span></div>` + (mode==='v'?`<div><b>Variance V</b><span>${fmt(V,0)}</span></div><div><b>Écart-type σ</b><span>${fmt(Math.sqrt(V))}</span></div>`:'');
  };
  draw();
}

function boxSVG(series){ // series: [{name, f}]
  const lo = Math.min(...series.map(s=>s.f.min)), hi = Math.max(...series.map(s=>s.f.max));
  const W=640, L=80, R=24, H=60+series.length*70; const X=v=>L+(v-lo)/(hi-lo||1)*(W-L-R);
  let g='';
  series.forEach((s,k)=>{ const y=30+k*70, f=s.f, col=k?'var(--g2)':'var(--g1)';
    g+=`<text x="8" y="${y+5}" style="font-weight:600;fill:var(--ink)">${s.name}</text>
    <line x1="${X(f.min)}" x2="${X(f.q1)}" y1="${y}" y2="${y}" stroke="${col}" stroke-width="2"/><line x1="${X(f.q3)}" x2="${X(f.max)}" y1="${y}" y2="${y}" stroke="${col}" stroke-width="2"/>
    <line x1="${X(f.min)}" x2="${X(f.min)}" y1="${y-10}" y2="${y+10}" stroke="${col}" stroke-width="2"/><line x1="${X(f.max)}" x2="${X(f.max)}" y1="${y-10}" y2="${y+10}" stroke="${col}" stroke-width="2"/>
    <rect x="${X(f.q1)}" y="${y-18}" width="${Math.max(1,X(f.q3)-X(f.q1))}" height="36" fill="color-mix(in srgb, ${col} 15%, white)" stroke="${col}" stroke-width="2" rx="3"/>
    <line x1="${X(f.me)}" x2="${X(f.me)}" y1="${y-18}" y2="${y+18}" stroke="${col}" stroke-width="3.5"/>
    ${[['min',f.min],['Q1',f.q1],['Me',f.me],['Q3',f.q3],['max',f.max]].map(([n,v],j)=>`<text x="${X(v)}" y="${y+(j%2?34:-24)}" text-anchor="middle">${n}=${fmt(v)}</text>`).join('')}`; });
  const ticks=[]; for(let v=Math.ceil(lo); v<=hi; v++) ticks.push(v);
  g+=`<line x1="${L}" x2="${W-R}" y1="${H-14}" y2="${H-14}" stroke="var(--line)"/>`+ticks.map(v=>`<text x="${X(v)}" y="${H-1}" text-anchor="middle">${v}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

const APT = {x:[62,52,72,75,30,90,54,94,107,130,200,138], y:[115,95,119,165,55,202,105,223,244,256,435,320]};
function regression(x,y){ const n=x.length, mx=x.reduce((a,b)=>a+b)/n, my=y.reduce((a,b)=>a+b)/n;
  let sxy=0,sxx=0,syy=0; for(let i=0;i<n;i++){sxy+=(x[i]-mx)*(y[i]-my); sxx+=(x[i]-mx)**2; syy+=(y[i]-my)**2;}
  const a=sxy/sxx; return {mx,my,a,b:my-a*mx,r:sxy/Math.sqrt(sxx*syy)}; }
function scatter(root, opts){
  const W=640,H=380,L=52,R=16,T=14,B=40, xmax=240,ymax=600;
  const X=v=>L+v/xmax*(W-L-R), Y=v=>H-B-v/ymax*(H-T-B);
  const reg = regression(APT.x,APT.y);
  root.innerHTML = `<div class="row ctrl"></div><svg viewBox="0 0 ${W} ${H}"></svg><div class="out"></div>`;
  const st = {line:!!opts.line, res:false, G:true, xv:120};
  const ctrl = root.querySelector('.ctrl');
  if(opts.line) ctrl.innerHTML = `<label><input type="checkbox" class="cres"> Afficher les écarts MᵢPᵢ</label><label>Estimer pour x = <input type="range" min="20" max="240" value="120" class="xr"> <b class="xv mono">120</b> m²</label>`;
  else ctrl.innerHTML = `<label><input type="checkbox" class="cg" checked> Afficher le point moyen G</label>`;
  const svg = root.querySelector('svg');
  const draw = () => {
    let g='';
    for(let v=0;v<=xmax;v+=20) g+=`<line x1="${X(v)}" x2="${X(v)}" y1="${T}" y2="${H-B}" stroke="var(--line)" stroke-width=".6"/><text x="${X(v)}" y="${H-B+16}" text-anchor="middle">${v}</text>`;
    for(let v=0;v<=ymax;v+=100) g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width=".6"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`;
    g+=`<text x="${(W+L)/2}" y="${H-4}" text-anchor="middle">Superficie (m²)</text><text x="12" y="${T+6}" transform="rotate(-90 12 ${T+6})" text-anchor="end">Prix (k€)</text>`;
    if(st.line){
      if(st.res) APT.x.forEach((x,i)=>{ g+=`<line x1="${X(x)}" x2="${X(x)}" y1="${Y(APT.y[i])}" y2="${Y(reg.a*x+reg.b)}" stroke="var(--g2)" stroke-width="2" stroke-dasharray="3 3"/>`; });
      g+=`<line x1="${X(10)}" x2="${X(235)}" y1="${Y(reg.a*10+reg.b)}" y2="${Y(reg.a*235+reg.b)}" stroke="var(--acc)" stroke-width="2.5"/>`;
      g+=`<rect x="${X(30)}" y="${T}" width="${X(200)-X(30)}" height="${H-T-B}" fill="var(--acc)" opacity=".05"/>`;
      const yv = reg.a*st.xv+reg.b;
      g+=`<line x1="${X(st.xv)}" x2="${X(st.xv)}" y1="${Y(0)}" y2="${Y(yv)}" stroke="var(--g3)" stroke-dasharray="4 3"/><line x1="${L}" x2="${X(st.xv)}" y1="${Y(yv)}" y2="${Y(yv)}" stroke="var(--g3)" stroke-dasharray="4 3"/><circle cx="${X(st.xv)}" cy="${Y(yv)}" r="6" fill="var(--g3)"/>`;
    }
    APT.x.forEach((x,i)=>{ g+=`<circle cx="${X(x)}" cy="${Y(APT.y[i])}" r="5.5" fill="var(--ink)" opacity=".8"><title>M${i+1} (${x} m² ; ${APT.y[i]} k€)</title></circle>`; });
    if(st.G) g+=`<circle cx="${X(reg.mx)}" cy="${Y(reg.my)}" r="8" fill="var(--g2)" stroke="#fff" stroke-width="2"/><text x="${X(reg.mx)+12}" y="${Y(reg.my)+18}" style="fill:var(--g2);font-weight:700">G (${fmt(reg.mx)} ; ${fmt(reg.my)})</text>`;
    svg.innerHTML = g;
    const out = root.querySelector('.out');
    if(st.line){ const yv=reg.a*st.xv+reg.b, inside = st.xv>=30 && st.xv<=200;
      out.innerHTML = `<div><b>Droite de régression</b><span>y = ${fmt(reg.a,4)}x ${reg.b<0?'−':'+'} ${fmt(Math.abs(reg.b),3)}</span></div><div><b>Coefficient R</b><span>${fmt(reg.r,4)}</span></div><div><b>R²</b><span>${fmt(reg.r**2,4)}</span></div><div><b>Estimation (${st.xv} m²)</b><span>≈ ${fmt(yv,1)} k€</span></div><div><b>Type</b><span style="color:${inside?'var(--g3)':'var(--g2)'}">${inside?'interpolation':'extrapolation'}</span></div>`; }
    else out.innerHTML = `<div><b>x̄ (superficie moyenne)</b><span>${fmt(reg.mx)} m²</span></div><div><b>ȳ (prix moyen)</b><span>${fmt(reg.my)} k€</span></div>`;
  };
  const cg=root.querySelector('.cg'); if(cg) cg.onchange=()=>{st.G=cg.checked; draw();};
  const cr=root.querySelector('.cres'); if(cr) cr.onchange=()=>{st.res=cr.checked; draw();};
  const xr=root.querySelector('.xr'); if(xr) xr.oninput=()=>{st.xv=+xr.value; root.querySelector('.xv').textContent=xr.value; draw();};
  draw();
}

    <div class="prop"><b>Complément</b><span class="mono">a+${ov('a')} = 1 &nbsp; a${ov('a')} = 0</span></div>
  </div>
  <p class="muted">⚠ La distributivité de l'addition sur la multiplication n'existe pas avec les nombres ordinaires : c'est une particularité de l'algèbre de Boole.</p>
  <div class="lab"><div class="labt">🧪 Vérifie une propriété avec une table de vérité</div><select class="pp"></select><div class="tbl" style="margin-top:10px"></div></div>`,
  init(el){ const P=[
      ['a + bc = (a+b)(a+c)', `a + bc`, `(a+b)(a+c)`, (a,b,c)=>a|(b&c), (a,b,c)=>(a|b)&(a|c),3],
      ['a(b+c) = ab + ac', `a(b+c)`, `ab + ac`, (a,b,c)=>a&(b|c), (a,b,c)=>(a&b)|(a&c),3],
      ['a + 1 = 1', `a + 1`, `1`, a=>1, a=>1,1],
      ['a + ā = 1', `a + ${ov('a')}`, `1`, a=>a|(1-a), a=>1,1],
      ['aā = 0', `a${ov('a')}`, `0`, a=>a&(1-a), a=>0,1],
      ['a + 0 = a', `a + 0`, `a`, a=>a, a=>a,1]];
    const sel=el.querySelector('.pp'); sel.innerHTML=P.map((p,k)=>`<option value="${k}">${p[0]}</option>`).join('');
    const paint=()=>{ const p=P[+sel.value], n=p[5], vs=VARS3.slice(0,n); let h=`<table class="tt"><tr>${vs.map(v=>`<th>${v}</th>`).join('')}<th>${p[1]}</th><th>${p[2]}</th><th></th></tr>`;
      for(let m=0;m<(1<<n);m++){ const b=vs.map((_,v)=>(m>>(n-1-v))&1); const L=p[3](...b),R=p[4](...b); h+=`<tr>${b.map(x=>`<td>${x}</td>`).join('')}<td class="res">${L}</td><td class="res">${R}</td><td>${L===R?'✅':'❌'}</td></tr>`; }
      el.querySelector('.tbl').innerHTML=h+`</table><p class="muted">Les deux colonnes sont identiques sur toutes les lignes : la propriété est démontrée.</p>`; };
    sel.onchange=paint; paint(); },
  check:{q:"Que vaut a + bc ?", opts:["(a + b)(a + c)","ab + ac","abc","a + b + c"], a:0, ex:"C'est la distributivité de l'addition par rapport à la multiplication, propre à l'algèbre de Boole."}
},
{ title:"Propriétés déduites : idempotence, absorption…", html:`
  <div class="grid2">
    <div class="prop"><b>Idempotence</b><span class="mono">a+a = a &nbsp; aa = a</span></div>
    <div class="prop"><b>Double complément</b><span class="mono">${ovo(ov('a'))} = a</span></div>
    <div class="prop"><b>Absorption</b><span class="mono">a + ab = a<br>a(a+b) = a</span></div>
    <div class="prop"><b>Autre résultat utile</b><span class="mono">a + ${ov('a')}b = a + b</span></div>
  </div>
  <p>Ces formules se démontrent <b>par le calcul</b>, en enchaînant les propriétés de l'étape précédente. Clique pour dérouler chaque démonstration.</p>
  <div class="lab"><div class="labt">🧪 Démonstrations pas à pas</div><div class="row dmb"></div><div class="row" style="margin-top:8px"><button class="btn sm primary nx">Étape suivante ↓</button><button class="btn sm rs">Recommencer</button></div><div class="dsteps" style="margin-top:10px;font-size:17px"></div></div>`,
  init(el){ const D=[
      ['a + ab = a',[['a + ab',''],['= a·1 + ab','neutre : a = a·1'],['= a(1 + b)','factorisation (distributivité)'],['= a·1','absorbant : 1 + b = 1'],['= a','neutre ✔']]],
      ['a(a + b) = a',[['a(a + b)',''],['= aa + ab','distributivité'],['= a + ab','idempotence : aa = a'],['= a','absorption (démontrée juste avant) ✔']]],
      [`a + ${ov('a')}b = a + b`,[[`a + ${ov('a')}b`,''],[`= (a + ${ov('a')})(a + b)`,'distributivité de + sur ×'],['= 1·(a + b)',`complément : a + ${ov('a')} = 1`],['= a + b','neutre ✔']]],
      [`(a + b)(a + ${ov('b')}) = a`,[[`(a + b)(a + ${ov('b')})`,''],[`= a + b${ov('b')}`,'distributivité de + sur × (à l\'envers)'],['= a + 0',`complément : b${ov('b')} = 0`],['= a','neutre ✔']]]];
    const sel={value:0}; const db=el.querySelector('.dmb'); db.innerHTML=D.map((d,k)=>`<button class="btn sm mono" data-k="${k}">${d[0]}</button>`).join('');
    let shown=1; const paint=()=>{ db.querySelectorAll('button').forEach(b=>b.classList.toggle('primary',+b.dataset.k===sel.value)); const d=D[+sel.value]; el.querySelector('.dsteps').innerHTML=`<div style="margin-bottom:6px"><b>Objectif :</b> <span class="mono">${d[0]}</span></div>`+d[1].map((s,k)=>`<div class="reveal-step ${k<shown?'show':''}">${s[0]}<em>${s[1]}</em></div>`).join(''); el.querySelector('.nx').disabled = shown>=d[1].length; };
    db.querySelectorAll('button').forEach(b=>b.onclick=()=>{sel.value=+b.dataset.k; shown=1; paint();}); el.querySelector('.nx').onclick=()=>{shown++;paint();}; el.querySelector('.rs').onclick=()=>{shown=1;paint();}; paint(); },
  check:{q:"Simplifie : a + ab", opts:["a","ab","a + b","1"], a:0, ex:"C'est la loi d'absorption : a + ab = a(1 + b) = a·1 = a."}
},
{ title:"Les lois de De Morgan", html:`
  <div class="def"><b>Lois de De Morgan</b><span class="big">${ov('ab')} = ${ov('a')} + ${ov('b')}</span> &nbsp;&nbsp;et&nbsp;&nbsp; <span class="big">${ov('a + b')} = ${ov('a')} · ${ov('b')}</span><br>Le complément « casse » la barre et échange + et ×.</div>
  <p>Pour les démontrer, on utilise une <b>table de vérité</b> : puisqu'il n'y a que deux valeurs possibles, on peut tester tous les cas.</p>
  <div class="lab"><div class="labt">🧪 À toi : complète les colonnes en cliquant sur les « ? »</div>
    <table class="tt dm"></table><div class="row" style="margin-top:8px"><button class="btn sm primary vf">Vérifier</button><button class="btn sm sol">Voir la solution</button></div><div class="msg" style="margin-top:8px"></div></div>
  <p><b>Méthode pour complémenter une expression</b> : exemple ${ovo('a + b'+ov('c'))} = ${ov('a')} · ${ovo('b'+ov('c'))} = ${ov('a')}(${ov('b')} + c).</p>`,
  init(el){ const rows=[[0,0],[0,1],[1,0],[1,1]]; const user=rows.map(()=>[null,null]); const sol=r=>[1-(r[0]&r[1]),(1-r[0])|(1-r[1])];
    const t=el.querySelector('.dm'); let checked=false;
    const paint=()=>{ t.innerHTML=`<tr><th>a</th><th>b</th><th>ab</th><th>${ov('ab')}</th><th>${ov('a')}</th><th>${ov('b')}</th><th>${ov('a')}+${ov('b')}</th></tr>`+rows.map((r,i)=>{ const s=sol(r); const cell=j=>{const u=user[i][j]; const cls=checked&&u!==null?(u===s[j]?'okc':'koc'):''; return `<td class="edit res ${cls}" data-i="${i}" data-j="${j}">${u===null?'?':u}</td>`;}; return `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[0]&r[1]}</td>${cell(0)}<td>${1-r[0]}</td><td>${1-r[1]}</td>${cell(1)}</tr>`;}).join('');
      t.querySelectorAll('td.edit').forEach(td=>td.onclick=()=>{const i=+td.dataset.i,j=+td.dataset.j; user[i][j]=user[i][j]===null?0:1-user[i][j]; checked=false; el.querySelector('.msg').innerHTML=''; paint();}); };
    el.querySelector('.vf').onclick=()=>{ checked=true; paint(); const all=rows.every((r,i)=>user[i][0]===sol(r)[0]&&user[i][1]===sol(r)[1]); const filled=user.every(u=>u[0]!==null&&u[1]!==null);
      el.querySelector('.msg').innerHTML= all?`✅ <b>Bravo !</b> Les colonnes ${ov('ab')} et ${ov('a')}+${ov('b')} sont identiques : la loi est démontrée.`:filled?'❌ Certaines cases sont fausses (en rouge). Rappel : '+ov('ab')+' est le contraire de ab.':'Complète toutes les cases « ? ».'; };
    el.querySelector('.sol').onclick=()=>{ rows.forEach((r,i)=>user[i]=sol(r)); el.querySelector('.vf').onclick(); };
    paint(); },
  check:{q:`Quel est le complément de a + ${ov('b')}c ?`, opts:[`${ov('a')}(b + ${ov('c')})`,`${ov('a')} + b${ov('c')}`,`${ov('a')}b${ov('c')}`,`a(b + ${ov('c')})`], a:0, ex:`On applique De Morgan deux fois.<br>① Le complément d'une <b>somme</b> est le <b>produit</b> des compléments : ${ovo('a + '+ov('b')+'c')} = ${ov('a')} · ${ovo(ov('b')+'c')}.<br>② Le complément d'un <b>produit</b> est la <b>somme</b> des compléments : ${ovo(ov('b')+'c')} = ${ovo(ov('b'))} + ${ov('c')} = b + ${ov('c')} (double complément).<br>③ Donc le résultat est ${ov('a')}(b + ${ov('c')}).`}
},
{ title:"Tableau de Karnaugh à 2 variables", html:`
  <p>Introduit en 1953 par Maurice Karnaugh (Bell Labs), le tableau permet de <b>simplifier visuellement</b> une expression. Avec 2 variables, il a 4 cases, une par produit : ab, a${ov('b')}, ${ov('a')}b, ${ov('a')}${ov('b')}.</p>
  <p>On <b>colorie</b> les cases de l'expression, puis on <b>regroupe</b> les cases voisines : une ligne ou une colonne entière se réduit à une seule variable. Par exemple ab + a${ov('b')} = a(b + ${ov('b')}) = a.</p>
  <div class="lab"><div class="labt">🧪 Clique sur les cases pour les cocher</div><div class="km2"></div></div>`,
  init(el){ karnaugh(el.querySelector('.km2'),2,[{label:`Exemple du cours`,m:[3,2,0]},{label:'Ligne a',m:[3,2]},{label:'Colonne b',m:[3,1]},{label:'Diagonale',m:[3,0]}]); },
  check:{q:`Que donne la simplification de ab + ${ov('a')}b ?`, opts:["b","a",`a + b`,"1"], a:0, ex:`C'est la colonne b : ab + ${ov('a')}b = b(a + ${ov('a')}) = b·1 = b.`}
},
{ title:"Tableau de Karnaugh à 3 variables", html:`
  <p>Avec 3 variables, le tableau a <b>8 cases</b>. Les colonnes sont rangées dans l'ordre bc, b${ov('c')}, ${ov('b')}${ov('c')}, ${ov('b')}c : entre deux colonnes voisines, une seule variable change. <b>La première et la dernière colonne sont aussi voisines</b> (le tableau « se referme »).</p>
  <div class="def"><b>Règles de regroupement</b>• un bloc de <b>4</b> cases contiguës → <b>1</b> variable<br>• un bloc de <b>2</b> cases contiguës → <b>2</b> variables<br>• une case <b>isolée</b> → <b>3</b> variables<br>On cherche les blocs les plus grands possibles, et le moins de blocs possible (une case peut servir à plusieurs blocs).</div>
  <div class="lab"><div class="labt">🧪 Clique sur les cases ou essaie les exemples</div><div class="km3"></div></div>`,
  init(el){ karnaugh(el.querySelector('.km3'),3,[{label:'Ligne a → a',m:[7,6,5,4]},{label:`Bloc 4 → ${ov('b')}`,m:[4,5,0,1]},{label:'Bloc 2 → ab',m:[7,6]},{label:`Bords → ${ov('b')}c`,m:[5,1]},{label:'Mélange',m:[7,6,1,0,4]},{label:'Bords (4 cases)',m:[7,5,3,1]}]); },
  check:{q:"Dans un tableau de Karnaugh à 3 variables, un bloc de 4 cases contiguës se simplifie en…", opts:["une seule variable","deux variables","trois variables","la constante 1"], a:0, ex:"4 cases = la moitié du tableau : deux variables s'éliminent, il en reste une."}
},
{ title:"Connecteurs NAND, NOR et XOR", html:`
  <p>Le programme signale l'intérêt de trois connecteurs très utilisés en électronique et en informatique :</p>
  <div class="grid2">
    <div class="prop"><b>NON-ET (nand)</b><span class="mono">${ov('ab')}</span><br><span class="muted">vaut 0 seulement si a = b = 1</span></div>
    <div class="prop"><b>NON-OU (nor)</b><span class="mono">${ov('a + b')}</span><br><span class="muted">vaut 1 seulement si a = b = 0</span></div>
    <div class="prop"><b>OU exclusif (xor)</b><span class="mono">a ⊕ b = a${ov('b')} + ${ov('a')}b</span><br><span class="muted">vaut 1 si a et b sont différents</span></div>
  </div>
  <div class="lab"><div class="labt">🧪 Compare les trois connecteurs</div><div class="row sws"></div><div class="tbl" style="margin-top:10px"></div></div>
  <p class="muted">Bon à savoir : avec des portes NAND seules (ou NOR seules), on peut construire n'importe quel circuit logique.</p>`,
  init(el){ const v={a:1,b:1}; switches(el.querySelector('.sws'),['a','b'],v,()=>{ el.querySelector('.tbl').innerHTML=`<table class="tt"><tr><th>a</th><th>b</th><th>NAND ${ov('ab')}</th><th>NOR ${ov('a+b')}</th><th>XOR a⊕b</th></tr>`+[[0,0],[0,1],[1,0],[1,1]].map(r=>`<tr class="${r[0]===v.a&&r[1]===v.b?'cur':''}"><td>${r[0]}</td><td>${r[1]}</td><td class="res">${1-(r[0]&r[1])}</td><td class="res">${1-(r[0]|r[1])}</td><td class="res">${r[0]^r[1]}</td></tr>`).join('')+'</table>'; }); },
  check:{q:"Pour quelles valeurs a ⊕ b (XOR) vaut-il 1 ?", opts:["Quand a et b sont différents","Quand a et b valent 1","Quand au moins l'un vaut 1","Quand a et b valent 0"], a:0, ex:"Le OU exclusif est vrai quand exactement une des deux variables vaut 1."}
}];

const STATS = [
{ title:"La médiane", html:`
  <div class="def"><b>Définition</b>La <b>médiane</b> Me partage la série <b>rangée</b> en deux groupes de même effectif : l'un contient les valeurs ≤ Me, l'autre les valeurs ≥ Me.</div>
  <p><b>Méthode (série discrète)</b> : on range les N valeurs dans l'ordre croissant, puis<br>• si N est <b>impair</b>, Me est la valeur de rang <span class="mono">(N+1)/2</span> ;<br>• si N est <b>pair</b>, Me est la moyenne des valeurs de rangs <span class="mono">N/2</span> et <span class="mono">N/2 + 1</span>.</p>
  <div class="lab"><div class="labt">🧪 Trouve la médiane</div><div class="sw1"></div></div>
  <p class="muted">Avec les tableaux du cours : en janvier (N = 31), Me est la 16ᵉ valeur, soit 3° ; en février (N = 28), Me = (5 + 6)/2 = 5,5°. Essaie les boutons ci-dessus pour le vérifier.</p>`,
  init(el){ seriesWidget(el.querySelector('.sw1'),'me'); },
  check:{q:"Une série rangée compte 20 valeurs. La médiane est…", opts:["la moyenne des valeurs de rangs 10 et 11","la valeur de rang 10","la valeur de rang 11","la valeur de rang 10,5"], a:0, ex:"N = 20 est pair : on fait la moyenne des valeurs de rangs N/2 = 10 et N/2 + 1 = 11."}
},
{ title:"Quartiles et écart interquartile", html:`
  <div class="def"><b>Définitions</b>• <b>Q1</b> : plus petite valeur de la série rangée telle qu'<b>au moins 25 %</b> des valeurs lui soient inférieures ou égales.<br>• <b>Q3</b> : plus petite valeur telle qu'<b>au moins 75 %</b> des valeurs lui soient inférieures ou égales.<br>• <b>Écart interquartile</b> : Q3 − Q1. L'intervalle [Q1 ; Q3] contient la <b>moitié centrale</b> des valeurs.</div>
  <p><b>Méthode</b> : on calcule <span class="mono">0,25 × N</span> (ou <span class="mono">0,75 × N</span>) et on l'arrondit à l'<b>entier supérieur</b> : c'est le rang de Q1 (ou de Q3).</p>

  <p class="muted">Plus l'écart interquartile est grand, plus les valeurs sont dispersées autour de la médiane.</p>`,
  init(el){ seriesWidget(el.querySelector('.sw2'),'q'); },

{ title:"Série continue : le polygone des FCC", html:`
  <p>Quand les données sont regroupées <b>par classes</b>, on calcule les <b>fréquences cumulées croissantes</b> (FCC), on trace leur polygone, puis on <b>lit graphiquement</b> :</p>
  <p>• Q1 en face de <b>0,25</b> &nbsp; • Me en face de <b>0,5</b> &nbsp; • Q3 en face de <b>0,75</b></p>
  <table class="tt"><tr><th>Note</th><th>[2;4[</th><th>[4;8[</th><th>[8;12[</th><th>[12;16[</th><th>[16;19]</th></tr><tr><td>Effectif</td><td>3</td><td>17</td><td>25</td><td>21</td><td>11</td></tr><tr><td>ECC</td><td>3</td><td>20</td><td>45</td><td>66</td><td>77</td></tr><tr><td>FCC</td><td>3,9 %</td><td>26 %</td><td>58,4 %</td><td>85,7 %</td><td>100 %</td></tr></table>
  <div class="lab"><div class="labt">🧪 Déplace le curseur pour lire le polygone</div><div class="row"><label>FCC = <input type="range" class="fr" min="1" max="99" value="50"> <b class="fv mono">50 %</b></label><button class="btn sm" data-v="25">Q1</button><button class="btn sm" data-v="50">Me</button><button class="btn sm" data-v="75">Q3</button></div><div class="pol"></div><div class="out"></div></div>
  <p class="muted">Le cours lit graphiquement Me ≈ 11, Q1 ≈ 7,7 et Q3 ≈ 14,4 (notes de 77 candidats au bac). Le curseur calcule la lecture exacte sur le polygone.</p>`,
  init(el){ const P=[[2,0],[4,3/77*100],[8,20/77*100],[12,45/77*100],[16,66/77*100],[19,100]];
    const W=640,H=320,L=46,R=14,T=12,B=34, X=v=>L+(v-2)/(19-2)*(W-L-R), Y=v=>H-B-v/100*(H-T-B);
    const inv=f=>{ for(let k=1;k<P.length;k++) if(f<=P[k][1]) return P[k-1][0]+(P[k][0]-P[k-1][0])*(f-P[k-1][1])/(P[k][1]-P[k-1][1]); return 19; };
    const draw=f=>{ const x=inv(f); let g='';
      for(let v=2;v<=19;v++) g+=`<line x1="${X(v)}" x2="${X(v)}" y1="${T}" y2="${H-B}" stroke="var(--line)" stroke-width=".6"/><text x="${X(v)}" y="${H-B+16}" text-anchor="middle">${v}</text>`;
      for(let v=0;v<=100;v+=25) g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width=".6"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v}%</text>`;
      g+=`<polyline points="${P.map(p=>X(p[0])+','+Y(p[1])).join(' ')}" fill="none" stroke="var(--acc)" stroke-width="2.5"/>`+P.map(p=>`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="4" fill="var(--acc)"/>`).join('');
      g+=`<line x1="${L}" x2="${X(x)}" y1="${Y(f)}" y2="${Y(f)}" stroke="var(--g3)" stroke-width="2" stroke-dasharray="5 4"/><line x1="${X(x)}" x2="${X(x)}" y1="${Y(f)}" y2="${H-B}" stroke="var(--g3)" stroke-width="2" stroke-dasharray="5 4"/><circle cx="${X(x)}" cy="${Y(f)}" r="6" fill="var(--g3)"/><text x="${X(x)+8}" y="${H-B-8}" style="fill:var(--g3);font-weight:700">${fmt(x,1)}</text>`;
      el.querySelector('.pol').innerHTML=`<svg viewBox="0 0 ${W} ${H}">${g}</svg>`; el.querySelector('.fv').textContent=f+' %';
      const nm=f===25?'Q1':f===50?'Me':f===75?'Q3':null;
      el.querySelector('.out').innerHTML=`<div><b>Lecture</b><span>${f} % des notes sont ≤ ${fmt(x,2)}</span></div>`+(nm?`<div><b>${nm}</b><span>≈ ${fmt(x,1)}</span></div>`:''); };
    const fr=el.querySelector('.fr'); fr.oninput=()=>draw(+fr.value); el.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{fr.value=b.dataset.v; draw(+b.dataset.v);}); draw(50); },
  check:{q:"Sur le polygone des FCC, on lit la médiane en se plaçant à…", opts:["0,5 sur l'axe des ordonnées","0,5 sur l'axe des abscisses","0,25 sur l'axe des ordonnées","la valeur la plus haute"], a:0, ex:"Me est la valeur pour laquelle 50 % des données sont inférieures ou égales : on part de 0,5 en ordonnée."}
},
{ title:"Le diagramme en boîte", html:`
  <div class="def"><b>Définition</b>Le <b>diagramme en boîte</b> (boîte à moustaches, diagramme de Tukey, box plot) représente cinq paramètres : <b>x<sub>min</sub>, Q1, Me, Q3, x<sub>max</sub></b>. La boîte va de Q1 à Q3, le trait intérieur est la médiane, les « moustaches » vont jusqu'aux extrêmes.</div>
  <p>Son intérêt : <b>comparer d'un coup d'œil</b> plusieurs séries.</p>
  <div class="lab"><div class="labt">🧪 Comparaison janvier / février (températures du cours)</div><div class="bx"></div>
    <p class="muted">La boîte de février est plus étroite (écart interquartile 1° contre 3°) : les températures de février sont plus concentrées autour de la médiane, et globalement plus élevées.</p></div>
  <div class="lab"><div class="labt">🧪 Ta propre série</div><textarea class="ta">2 4 4 5 7 8 9 10 12 15 18</textarea><div class="bx2"></div></div>`,
  init(el){ el.querySelector('.bx').innerHTML=boxSVG([{name:'Janvier',f:fiveNum(JAN)},{name:'Février',f:fiveNum(FEV)}]);
    const ta=el.querySelector('.ta'); const p=()=>{const s=parseSeries(ta.value); el.querySelector('.bx2').innerHTML = s.length>1? boxSVG([{name:'Ma série',f:fiveNum(s)}]) : '<i>Entre au moins deux valeurs.</i>';}; ta.oninput=p; p(); },
  check:{q:"Quelle proportion des valeurs se trouve dans la « boîte » ?", opts:["environ 50 %","environ 25 %","environ 75 %","100 %"], a:0, ex:"La boîte va de Q1 à Q3 : elle contient la moitié centrale des valeurs."}
},
{ title:"La moyenne", html:`
  <div class="def"><b>Définition</b>Pour une série de valeurs x₁, …, x<sub>p</sub> d'effectifs n₁, …, n<sub>p</sub> et d'effectif total N :<br><span class="big">x̄ = (n₁x₁ + n₂x₂ + … + n<sub>p</sub>x<sub>p</sub>) / N</span><br>ou avec les fréquences : x̄ = f₁x₁ + f₂x₂ + … + f<sub>p</sub>x<sub>p</sub>.</div>
  <p>Exemple du cours : 150 ouvriers à 1 800 €, 12 cadres à 2 900 € et 3 cadres supérieurs à 4 600 €. Modifie le tableau pour voir l'effet sur la moyenne.</p>
  <div class="lab"><div class="labt">🧪 Calcule une moyenne pondérée</div><div class="ft"></div></div>
  <p class="muted">Remarques : calculer une moyenne revient à <b>répartir équitablement</b> les valeurs. Si les données sont regroupées par classes, on prend pour xᵢ le <b>centre</b> de chaque classe.</p>`,
  init(el){ freqTable(el.querySelector('.ft'),'m'); },
  check:{q:"Données regroupées : la classe [10 ; 20[ a un effectif de 4. Quelle valeur xᵢ utilise-t-on pour la moyenne ?", opts:["15","10","20","4"], a:0, ex:"On prend le centre de la classe : (10 + 20)/2 = 15."}
},
{ title:"Variance et écart-type", html:`
  <div class="def"><b>Définitions</b><span class="big">V = [n₁(x₁ − x̄)² + … + n<sub>p</sub>(x<sub>p</sub> − x̄)²] / N</span><br>L'<b>écart-type</b> est σ = √V.</div>
  <p>• La variance est la <b>moyenne des carrés des écarts</b> à la moyenne.<br>• σ mesure la dispersion autour de la moyenne : plus il est <b>petit</b>, plus les valeurs sont <b>concentrées</b>.<br>• σ a la <b>même unité</b> que les valeurs (ici des euros).</p>
  <div class="lab"><div class="labt">🧪 Observe le calcul colonne par colonne</div><div class="ft"></div>
  <p class="muted">Essaie : mets les trois salaires à la même valeur → σ = 0 (aucune dispersion). Augmente le salaire des cadres supérieurs → σ grandit.</p></div>`,
  init(el){ freqTable(el.querySelector('.ft'),'v'); },
  check:{q:"Des salaires sont exprimés en euros. Dans quelle unité est l'écart-type σ ?", opts:["en euros","en euros²","sans unité","en pourcentage"], a:0, ex:"σ = √V : la racine carrée ramène à l'unité des valeurs (la variance, elle, est en euros²)."}
},
{ title:"Résumer une série : (x̄ ; σ) ou (Me ; Q3 − Q1) ?", html:`
  <p>Pour résumer une série, on associe un indicateur de <b>position</b> et un indicateur de <b>dispersion</b> :</p>
  <div class="compare">
    <div><h3>( x̄ ; σ )</h3><b>+</b> utilise toutes les valeurs ; on peut calculer la moyenne globale à partir des moyennes des sous-groupes.<br><b>−</b> sensible aux valeurs extrêmes.<br><b>Choix :</b> pertinent si la série est assez symétrique (« courbe en cloche »).</div>
    <div><h3>( Me ; Q3 − Q1 )</h3><b>+</b> simple à interpréter ; <b>robuste</b> : peu modifié par les valeurs extrêmes.<br><b>−</b> impossible de retrouver la médiane à partir de celles des sous-séries ; ne tient compte que de 50 % des valeurs.</div>
  </div>
  <div class="lab"><div class="labt">🧪 Expérience : la robustesse</div>
    <p>Huit salaires : 1 500, 1 600, 1 700, 1 800, 1 900, 2 000, 2 100 et <b>un dernier que tu fais varier</b>.</p>
    <label>Dernier salaire : <input type="range" class="rb" min="2200" max="20000" step="100" value="2200"> <b class="rv mono">2 200 €</b></label><div class="out"></div><div class="bars"></div></div>`,
  init(el){ const base=[1500,1600,1700,1800,1900,2000,2100]; const rb=el.querySelector('.rb');
    const p=()=>{ const s=[...base,+rb.value]; const m=s.reduce((a,b)=>a+b)/s.length; const me=medianInfo(s.slice().sort((a,b)=>a-b)).val; el.querySelector('.rv').textContent=fmt(+rb.value)+' €';
      el.querySelector('.out').innerHTML=`<div><b>Moyenne x̄</b><span style="color:var(--g2)">${fmt(m,0)} €</span></div><div><b>Médiane Me</b><span style="color:var(--g1)">${fmt(me,0)} €</span></div>`;
      const mx=20000, w=v=>v/mx*100;
      el.querySelector('.bars').innerHTML=`<div style="margin-top:12px;font-size:14px">Moyenne<div style="height:14px;background:var(--g2);width:${w(m)}%;border-radius:4px;transition:width .2s"></div>Médiane<div style="height:14px;background:var(--g1);width:${w(me)}%;border-radius:4px"></div></div><p class="muted">La moyenne s'envole avec la valeur extrême, la médiane ne bouge pas : elle est <b>robuste</b>.</p>`; };
    rb.oninput=p; p(); },
  check:{q:"Une série contient quelques valeurs extrêmes suspectes. Quel résumé est le plus adapté ?", opts:["(Me ; Q3 − Q1)","(x̄ ; σ)","la valeur maximale seule","la variance seule"], a:0, ex:"La médiane et l'écart interquartile sont robustes : ils varient peu si les valeurs extrêmes changent."}
},
{ title:"Deux variables : nuage de points et point moyen", html:`
  <p>Quand on étudie <b>deux caractères</b> sur une même population (âge et revenu, taille et poids…), on obtient une <b>série statistique double</b> (xᵢ ; yᵢ).</p>
  <div class="def"><b>Définitions</b>• On la représente par un <b>nuage de points</b> Mᵢ(xᵢ ; yᵢ) dans un repère orthogonal.<br>• Le <b>point moyen</b> est G( x̄ ; ȳ ), où x̄ et ȳ sont les moyennes des xᵢ et des yᵢ.</div>
  <p>Exemple : superficie (m²) et prix (k€) des 12 derniers appartements vendus dans une petite ville. Survole un point pour voir ses coordonnées.</p>
  <div class="lab"><div class="labt">🧪 Le nuage des appartements</div><div class="sc"></div></div>`,
  init(el){ scatter(el.querySelector('.sc'),{line:false}); },
  check:{q:"Quelles sont les coordonnées du point moyen G ?", opts:["( x̄ ; ȳ )","( Me ; Me )","( x₁ ; y₁ )","( x̄ ; σ )"], a:0, ex:"G a pour abscisse la moyenne des xᵢ et pour ordonnée la moyenne des yᵢ. Ici G(92 ; 194,5)."}
},
{ title:"Ajustement affine et corrélation", html:`
  <p>Si le nuage est « presque » aligné, on cherche la droite qui passe <b>le plus près possible</b> des points : la <b>méthode des moindres carrés</b> minimise la somme S = (M₁P₁)² + … + (MₙPₙ)² des carrés des écarts verticaux.</p>
  <div class="def"><b>Théorème</b>Il existe une unique droite, passant par le point moyen G, qui rend S minimale : la <b>droite de régression de y en x</b>, d'équation y = ax + b (a et b sont obtenus à la calculatrice ou au tableur).</div>
  <div class="def"><b>Coefficient de corrélation linéaire R</b>• −1 ≤ R ≤ 1 &nbsp; • R a le <b>même signe</b> que le coefficient directeur a &nbsp; • l'ajustement est d'autant meilleur que R est <b>proche de −1 ou de 1</b>.</div>
  <div class="lab"><div class="labt">🧪 Droite de régression et estimations</div><div class="sc"></div>
  <p class="muted">Zone teintée = intervalle d'étude [30 ; 200] m². Dedans, on fait une <b>interpolation</b> ; dehors, une <b>extrapolation</b> (moins fiable). Le cours trouve ≈ 259,2 k€ pour 120 m² et ≈ 490,2 k€ pour 220 m².</p></div>`,
  init(el){ scatter(el.querySelector('.sc'),{line:true}); },
  check:{q:"Un ajustement donne R = −0,97. Que peut-on dire ?", opts:["Très bon ajustement, droite décroissante","Mauvais ajustement","Très bon ajustement, droite croissante","R est impossible"], a:0, ex:"|R| est proche de 1 donc l'ajustement est très bon ; R négatif signifie que le coefficient directeur est négatif."}
}];

const STATS_QUIZ = [
 {q:"Quelle est la médiane de la série 3 ; 7 ; 8 ; 12 ; 15 ?", opts:["8","9","7","12"], a:0, ex:"N = 5 est impair : Me est la valeur de rang 3, soit 8."},
 {q:"Quelle est la médiane de la série 2 ; 4 ; 6 ; 10 ?", opts:["5","4","6","5,5"], a:0, ex:"N = 4 est pair : Me = (4 + 6)/2 = 5."},
 {q:"En février, N = 28. Quel est le rang de Q3 ?", opts:["21","22","20","14"], a:0, ex:"0,75 × 28 = 21, déjà entier : Q3 est la valeur de rang 21."},
 {q:"Q1 = 7,7 et Q3 = 14,4. L'écart interquartile vaut…", opts:["6,7","22,1","11","3,35"], a:0, ex:"Q3 − Q1 = 14,4 − 7,7 = 6,7."},
 {q:"L'intervalle interquartile [Q1 ; Q3] contient…", opts:["la moitié centrale des valeurs","le quart des valeurs","toutes les valeurs","les valeurs extrêmes"], a:0, ex:"Entre Q1 (25 %) et Q3 (75 %), on trouve environ 50 % des valeurs."},
 {q:"Valeurs 2, 4, 9 d'effectifs 1, 2, 1. La moyenne vaut…", opts:["4,75","5","15","3,8"], a:0, ex:"x̄ = (1×2 + 2×4 + 1×9)/4 = 19/4 = 4,75."},
 {q:"La variance est…", opts:["la moyenne des carrés des écarts à la moyenne","la racine carrée de l'écart-type","la différence max − min","l'écart Q3 − Q1"], a:0, ex:"V = moyenne des (xᵢ − x̄)², et σ = √V."},
 {q:"Lequel de ces indicateurs est le moins sensible aux valeurs extrêmes ?", opts:["la médiane","la moyenne","l'écart-type","la variance"], a:0, ex:"La médiane est robuste ; moyenne, variance et écart-type utilisent toutes les valeurs, extrêmes comprises."},
 {q:"Le couple (x̄ ; σ) est surtout pertinent quand…", opts:["la série est assez symétrique, en « cloche »","la série contient des valeurs aberrantes","on ne connaît que les quartiles","N est impair"], a:0, ex:"C'est le critère donné dans le cours pour choisir (x̄ ; σ)."},
 {q:"La droite de régression de y en x passe toujours par…", opts:["le point moyen G","l'origine du repère","le premier point M₁","le point le plus haut"], a:0, ex:"Par construction, la droite des moindres carrés passe par G( x̄ ; ȳ )."},
 {q:"Avec y = 2,3103x − 18,049, quel prix estime-t-on pour 100 m² ?", opts:["≈ 213 k€","≈ 231 k€","≈ 249 k€","≈ 194,5 k€"], a:0, ex:"y = 2,3103 × 100 − 18,049 ≈ 213,0 k€."},
 {q:"Les superficies étudiées vont de 30 à 200 m². Estimer le prix d'un 220 m², c'est faire…", opts:["une extrapolation","une interpolation","une régression de x en y","un calcul de médiane"], a:0, ex:"220 est en dehors de l'intervalle d'étude : c'est une extrapolation, moins fiable qu'une interpolation."},
];

</script>
<script src="extra.js"></script>
<script src="general.js"></script>
<script>
/* ---------- App shell ---------- */
const CH = {
  num:{name:'Numération & arithmétique', g:'info', steps:NUM, quiz:NUM_QUIZ},
  logic:{name:'Logique & ensembles', g:'info', steps:LOGIC, quiz:LOGIC_QUIZ},
  bool:{name:'Calcul booléen', g:'info', steps:BOOL, quiz:BOOL_QUIZ},
  mat:{name:'Matrices', g:'info', steps:MAT, quiz:MAT_QUIZ},
  graph:{name:'Graphes & ordonnancement', g:'info', steps:GRAPH, quiz:GRAPH_QUIZ},
  suites:{name:'Suites numériques', g:'info', steps:SUITES, quiz:SUITES_QUIZ},
  stats:{name:'Statistique descriptive', g:'appro', steps:STATS, quiz:STATS_QUIZ},
  proba:{name:'Probabilités', g:'appro', steps:PROBA, quiz:PROBA_QUIZ},
  fonc:{name:'Fonctions & intégrales', g:'appro', steps:FONC, quiz:FONC_QUIZ},
  cge:{name:'Culture générale & expression', g:'cult', steps:CGE, quiz:CGE_QUIZ},
  eng:{name:'Anglais', g:'cult', steps:ENG, quiz:ENG_QUIZ},
  cejm1:{name:'CEJM : méthode, économie, management', g:'cejm', steps:CEJM1, quiz:CEJM1_QUIZ},
  cejm2:{name:'CEJM : droit', g:'cejm', steps:CEJM2, quiz:CEJM2_QUIZ},
  cyb1:{name:'Données, risques, identité', g:'cyber', steps:CYB1, quiz:CYB1_QUIZ},
  cyb2:{name:'Infrastructure & incidents', g:'cyber', steps:CYB2, quiz:CYB2_QUIZ},
};
const GROUPS = {info:"Maths pour l'informatique", appro:'Maths approfondies', cult:'Culture générale & anglais', cejm:'CEJM pour l\'informatique', cyber:'Cybersécurité (U7 SISR)'};
const GCLASS = {info:'', appro:'stats', cult:'cult', cejm:'cejm', cyber:'cyber'};
document.getElementById('tabs').innerHTML = Object.entries(GROUPS).map(([g,l])=>`<div class="tg"><span class="tgl">${l}</span><div class="tabs">${Object.entries(CH).filter(([,c])=>c.g===g).map(([k,c])=>`<button class="tab ${g}" data-ch="${k}">${c.name}</button>`).join('')}</div></div>`).join('')
  + `<div class="tg"><span class="tgl">Entraînement</span><div class="tabs"><button class="tab grand" data-ch="grand">🏆 Grand quiz général</button></div></div>`;
const hashCh = location.hash.slice(1);
const state = { ch: (CH[hashCh]||hashCh==='grand') ? hashCh : (()=>{ const c=store.get('ch','bool'); return CH[c]||c==='grand'?c:'bool'; })(), step:0, seen:{} };
function setCh(ch){ state.ch=ch; store.set('ch',ch);
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.ch===ch));
  if(ch==='grand'){ document.body.className='grand'; document.getElementById('htitle').textContent='Grand quiz général'; return renderGrand(); }
  state.step=Math.min(store.get('step-'+ch,0), CH[ch].steps.length); state.seen[ch]=new Set(store.get('seen-'+ch,[0]));
  document.body.className = GCLASS[CH[ch].g]; document.getElementById('htitle').textContent=CH[ch].name; render(); }
function render(){
  document.getElementById('stepper').style.display=''; document.querySelector('.nav').style.display='';
  const c=CH[state.ch], n=c.steps.length, total=n+1, s=state.step; state.seen[state.ch].add(s);
  store.set('step-'+state.ch,s); store.set('seen-'+state.ch,[...state.seen[state.ch]]);
  document.getElementById('stepper').innerHTML = Array.from({length:total},(_,k)=>`<button class="dot ${k===n?'quiz':''} ${state.seen[state.ch].has(k)?'seen':''} ${k===s?'cur':''}" data-k="${k}" title="${k===n?'Quiz final':c.steps[k].title.replace(/<[^>]+>/g,'')}">${k===n?'Quiz':k+1}</button>`).join('');
  document.querySelectorAll('.dot').forEach(d=>d.onclick=()=>{state.step=+d.dataset.k; render(); scrollTo({top:0,behavior:'smooth'});});
  const card=document.getElementById('card');
  if(s<n){ const st=c.steps[s]; card.innerHTML=`<div class="steptag">${GROUPS[c.g]} · Étape ${s+1} / ${n}</div><h2>${st.title}</h2><div class="body">${st.html}</div><div class="quizbox"></div>`;
    st.init && st.init(card.querySelector('.body')); makeQuiz(card.querySelector('.quizbox'),[st.check],true); }
  else { const best=store.get('best-'+state.ch,-1); card.innerHTML=`<div class="steptag">Quiz final</div><h2>Teste-toi : ${c.name}</h2><p class="muted">${c.quiz.length} questions dans un ordre aléatoire, une à la fois, avec correction immédiate.${best>=0?` Ton meilleur score : <b>${best} / ${c.quiz.length}</b>.`:''}</p><div class="qz"></div>`; makeQuiz(card.querySelector('.qz'),c.quiz); }
  document.getElementById('prev').disabled = s===0;
  const nx=document.getElementById('next'); nx.style.visibility = s===n?'hidden':'visible'; nx.textContent = s===n-1?'Passer au quiz →':'Suivant →';
}
function grandPool(){ const pool=[]; Object.entries(CH).forEach(([k,c])=>{ c.quiz.forEach(q=>pool.push({...q,ch:k})); c.steps.forEach(st=>pool.push({...st.check,ch:k})); }); EXAM_EXTRA.forEach(q=>pool.push({...q,exam:true})); return pool; }
function renderGrand(){
  document.getElementById('stepper').style.display='none'; document.querySelector('.nav').style.display='none';
  const pool=grandPool(); const sel=new Set(store.get('grand-sel',Object.keys(CH)).filter(k=>CH[k]));
  const card=document.getElementById('card');
  card.innerHTML=`<div class="steptag">Entraînement · ${pool.length} questions disponibles</div><h2>Grand quiz général</h2>
    <p>Des questions tirées au hasard dans tous les chapitres, dont des questions <b>📝 type examen</b> inspirées d'anciens sujets du BTS SIO. Toutes les épreuves sont couvertes : maths, culture générale, anglais, CEJM et cybersécurité. Choisis ton périmètre :</p>
    <div class="row" style="margin:10px 0"><button class="btn sm" data-s="all">Toutes les épreuves</button>${Object.entries(GROUPS).map(([g,l])=>`<button class="btn sm" data-s="${g}">${l}</button>`).join('')}</div>
    ${Object.entries(GROUPS).map(([g,l])=>`<div class="muted" style="margin-top:10px;font-weight:700">${l}</div><div class="grid2" style="margin-top:6px">${Object.entries(CH).filter(([,c])=>c.g===g).map(([k,c])=>`<label class="chk"><input type="checkbox" data-ch="${k}" ${sel.has(k)?'checked':''}> ${c.name} <span class="muted">(${pool.filter(q=>q.ch===k).length})</span></label>`).join('')}</div>`).join('')}
    <div class="row" style="margin-top:14px"><label>Nombre de questions <select class="gn"><option>10</option><option selected>20</option><option>30</option><option>50</option><option value="0">Toutes</option></select></label><button class="btn primary gs">Lancer le quiz →</button><span class="muted gc"></span></div>
    <div class="qz" style="margin-top:18px"></div>`;
  const boxes=[...card.querySelectorAll('input[type=checkbox]')];
  const count=()=>{ const chs=boxes.filter(b=>b.checked).map(b=>b.dataset.ch); store.set('grand-sel',chs); card.querySelector('.gc').textContent=`${pool.filter(q=>chs.includes(q.ch)).length} questions dans le périmètre`; card.querySelector('.gs').disabled=!chs.length; };
  boxes.forEach(b=>b.onchange=count);
  card.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ boxes.forEach(x=>x.checked = b.dataset.s==='all' || CH[x.dataset.ch].g===b.dataset.s); count(); });
  const launch=()=>{ const chs=boxes.filter(b=>b.checked).map(b=>b.dataset.ch); const n=+card.querySelector('.gn').value; let qs=shuffle(pool.filter(q=>chs.includes(q.ch))); if(n) qs=qs.slice(0,n);
    const qz=card.querySelector('.qz'); makeQuiz(qz,qs,false,{onRestart:launch}); qz.scrollIntoView({behavior:'smooth'}); };
  card.querySelector('.gs').onclick=launch; count();
}
document.getElementById('prev').onclick=()=>{ if(state.step>0){state.step--; render(); scrollTo({top:0,behavior:'smooth'});} };
document.getElementById('next').onclick=()=>{ state.step++; render(); scrollTo({top:0,behavior:'smooth'}); };
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setCh(t.dataset.ch));
setCh(state.ch);
</script>
</body>
